# CI Dokter HP Web — build, typecheck, dan tes tanpa secret apa pun.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instal dependensi
        run: npm ci

      - name: Typecheck frontend dan API
        run: npm run typecheck

      - name: Build frontend
        # build:prod menyuntik VITE_API_BASE_URL produksi (nilai publik;
        # satu-satunya sumber kebenaran di
        # apps/web/scripts/api-base-url.mjs). Guard prebuild + gate bundle
        # postbuild jalan otomatis di dalamnya; build TANPA origin API
        # yang valid gagal (regresi K-111, 19 Nov 2026).
        run: npm run build:prod

      - name: Tes unit frontend dan API
        run: npm run test

  # Audit keamanan dependensi (Red ronde 1): laporkan kerentanan
  # high/critical, tetapi tidak menggagalkan CI utama pada ronde ini.
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instal dependensi
        run: npm ci

      - name: Audit dependensi (high+)
        run: npm audit --audit-level=high

# Konfigurasi Cloudflare Worker untuk API Dokter HP Web.
name = "dokter-hp-api"
main = "src/index.ts"
compatibility_date = "2026-11-17"

# Database D1 (Wave 5: ID asli dari `wrangler d1 create dokter-hp-db`,
# database produksi `dokter-hp-db`, 11 tabel, migrasi 0001–0004).
# Pengembangan lokal (wrangler dev) memakai D1 lokal dan menerapkan
# migrasi dari folder migrations/ secara otomatis.
[[d1_databases]]
binding = "DB"
database_name = "dokter-hp-db"
database_id = "6b43e7b2-ab24-48a4-abf9-ff8cae97f397"
migrations_dir = "migrations"

# KV minimal (misal: pembatas laju, cache singkat). ID asli dari
# `wrangler kv namespace create KV` (Wave 5).
[[kv_namespaces]]
binding = "KV"
id = "347a1871fb464e92ac7e1e079134a062"

# Variabel lingkungan NON-RAHASIA (K-73, K-08). Nilai di bawah ini
# adalah PLACEHOLDER yang mengarah ke domain Pages produksi; tim
# deploy WAJIB menggantinya dengan domain sebenarnya sebelum deploy
# pertama. Secret (GOOGLE_CLIENT_SECRET, GEMINI_API_KEY,
# PIN_PEPPER) TIDAK PERNAH ditulis di sini — atur lewat
# `wrangler secret put`. GOOGLE_CLIENT_ID bersifat PUBLIK (K-77)
# dan GOOGLE_REDIRECT_URI bukan rahasia (terlihat di URL OAuth),
# sehingga keduanya boleh di [vars]. (Wave 5 snapshot 7: client
# ID ditambah ke [vars].)
[vars]
ALLOWED_ORIGIN = "https://dokter-hp-web.pages.dev,https://dokter-hp-web.vercel.app"
FRONTEND_URL = "https://dokter-hp-web.pages.dev"
GOOGLE_REDIRECT_URI = "https://dokter-hp-api.hiroohengkerr.workers.dev/api/auth/google/callback"
GOOGLE_CLIENT_ID = "68799972715-ia1jo7fteo89a4ti14dpak6dvg3dnfar.apps.googleusercontent.com"
GEMINI_MODEL = "gemini-3.5-flash-lite"
